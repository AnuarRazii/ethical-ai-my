name: RZ1 Validate
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    name: RZ1 Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate repository structure
        run: |
          set -e
          echo "Checking required files..."
          for file in README.md LICENSE ETHICS.md GOVERNANCE.md SECURITY.md ATTRIBUTION.md CODE_OF_CONDUCT.md FINAL_INTENT.md; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

      - name: Validate ethical compliance
        run: |
          set -e
          echo "Checking ethical compliance statement..."
          grep -q "## Core Ethical Principles" ETHICS.md || { echo "Ethical compliance block missing"; exit 1; }

      - name: Security baseline check
        run: |
          set -e
          echo "Checking for tracked .env files..."
          if git ls-files | grep -E '(^|/)\.env$' >/dev/null; then
            echo "Tracked .env file detected"
            exit 1
          fi

      - name: Final validation
        run: |
          set -e
          echo "RZ1 VALIDATION PASSED"

      - name: Publish commit status (success)
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'RZ1 Validate',
              description: 'RZ1 validation passed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Publish commit status (failure)
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'RZ1 Validate',
              description: 'RZ1 validation failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
